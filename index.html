<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบปลายภาค วิชาเคมีเพิ่มเติม 4 (Interactive Quiz)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #1a365d;
            --secondary: #2b6cb0;
            --bg-main: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #2d3748;
            --border-color: #e2e8f0;
            --correct: #38a169;
            --correct-bg: #f0fff4;
            --wrong: #e53e3e;
            --wrong-bg: #fff5f5;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .score-board {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .section-header {
            background-color: var(--secondary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            margin: 30px 0 15px 0;
        }

        .question-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .question-text {
            font-weight: 600;
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background-color: #f7fafc;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            text-align: left;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #edf2f7;
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct) !important;
            color: var(--correct) !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong) !important;
            color: var(--wrong) !important;
        }

        .explanation-box {
            display: none;
            background-color: #f7fafc;
            border-left: 4px solid var(--secondary);
            padding: 12px 15px;
            border-radius: 0 6px 6px 0;
            margin-top: 12px;
            font-size: 14px;
        }

        .explanation-box.show {
            display: block;
        }

        .reset-btn {
            background-color: #e2e8f0;
            color: var(--text-dark);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .reset-btn:hover {
            background-color: #cbd5e0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>แบบทดสอบปลายภาค วิชาเคมีเพิ่มเติม 4</h1>
        <p style="color: #718096; margin:0;">คลิกเลือกคำตอบที่ถูกต้องเพื่อตรวจผลทันที</p>
    </header>

    <div class="score-board">
        <span>คะแนนของคุณ: <span id="current-score">0</span> / 30</span>
        <button class="reset-btn" onclick="resetQuiz()">ทำใหม่ทั้งหมด</button>
    </div>

    <div id="quiz-content"></div>
</div>

<script>
const quizData = [
    // หมวดที่ 1
    { section: "หมวดที่ 1: พอลิเมอร์และพลาสติก (ข้อ 1 - 15)", q: "1. ข้อใดอธิบายความสัมพันธ์ระหว่างมอนอเมอร์และพอลิเมอร์ได้ถูกต้องที่สุด", options: ["ก. พอลิเมอร์เป็นสารโมเลกุลเล็กที่เกิดจากการรวมกันของมอนอเมอร์ด้วยพันธะไฮโดรเจน", "ข. มอนอเมอร์เป็นหน่วยย่อยที่มีโมเลกุลขนาดใหญ่ รวมตัวกันเป็นพอลิเมอร์ด้วยพันธะโคเวเลนต์", "ค. พอลิเมอร์เป็นสารโมเลกุลใหญ่ที่ประกอบด้วยหน่วยซ้ำ ๆ ของมอนอเมอร์เชื่อมต่อกันด้วยพันธะโคเวเลนต์", "ง. มอนอเมอร์และพอลิเมอร์มีมวลโมเลกุลเท่ากันแต่มีสมบัติทางกายภาพแตกต่างกัน"], answer: 2, exp: "พอลิเมอร์ (Polymer) คือสารโมเลกุลใหญ่ที่เกิดจากโมเลกุลขนาดเล็กที่เรียกว่า มอนอเมอร์ (Monomer) จำนวนมากมาเชื่อมต่อกันด้วยพันธะโคเวเลนต์" },
    { q: "2. ปฏิกิริยาพอลิเมอไรเซชันแบบเติม (Addition polymerization) แตกต่างจากแบบควบแน่น (Condensation polymerization) อย่างไร", options: ["ก. แบบเติมเกิดจากมอนอเมอร์ที่มีหมู่ฟังก์ชันอย่างน้อย 2 หมู่ ส่วนแบบควบแน่นเกิดจากมอนอเมอร์ที่มีพันธะคู่", "ข. แบบเติมไม่มีโมเลกุลขนาดเล็กหลุดออกมา ส่วนแบบควบแน่นมีโมเลกุลขนาดเล็ก เช่น H2O หรือ HCl หลุดออกมา", "ค. แบบเติมจะให้น้ำเป็นผลิตภัณฑ์พลอยได้เสมอ ส่วนแบบควบแน่นไม่เกิดผลิตภัณฑ์พลอยได้", "ง. แบบเติมเกิดเฉพาะในธรรมชาติ ส่วนแบบควบแน่นเกิดเฉพาะในสังเคราะห์"], answer: 1, exp: "แบบเติมไม่ออกผลิตภัณฑ์พลอยได้ ส่วนแบบควบแน่นมีโมเลกุลเล็ก ๆ เช่น น้ำ (H2O) หรือ HCl หลุดออกมา" },
    { q: "3. พอลิเมอร์ในข้อใดเกิดจากปฏิกิริยาพอลิเมอไรเซชันแบบควบแน่นทั้งหมด", options: ["ก. พอลิเอทิลีน (PE), พอลิโพรพีลีน (PP), พอลิสไตรีน (PS)", "ข. พอลิไวนิลคลอไรด์ (PVC), พอลิเตตราฟลูออโรเอทิลีน (Teflon), ยางธรรมชาติ", "ค. ไนลอน 6,6 (Nylon 6,6), พอลิเอสเทอร์ (PET), เบเคไลต์ (Bakelite)", "ง. พอลิบิวตาไดอีน, พอลิสไตรีน (PS), พอลิเอทิลีน (PE)"], answer: 2, exp: "ไนลอน 6,6, PET และเบเคไลต์ เกิดจากปฏิกิริยาแบบควบแน่นทั้งหมด ส่วน PE, PP, PS, PVC, Teflon เกิดจากแบบเติม" },
    { q: "4. พลาสติกชนิดใดมีโครงสร้างแบบร่างแห (Cross-linked polymer) และมีสมบัติอย่างไร", options: ["ก. พอลิเอทิลีนชนิดความหนาแน่นต่ำ (LDPE) - อ่อนตัวง่าย ทนความร้อนต่ำ", "ข. เบเคไลต์ (Bakelite) - แข็งแรง ไม่อ่อนตัวเมื่อได้รับความร้อน และขึ้นรูปใหม่ไม่ได้", "ค. พอลิโพรพีลีน (PP) - เหนียว ยืดหยุ่นได้ดี หลอมเหลวและนำกลับมาใช้ใหม่ได้", "ง. พอลิสไตรีน (PS) - เปราะ เป่าลมให้พองได้ หลอมเหลวได้ง่าย"], answer: 1, exp: "เบเคไลต์มีโครงสร้างแบบร่างแห แข็งแรง ไม่อ่อนตัวเมื่อโดนความร้อน (พลาสติกเทอร์มอเซต)" },
    { q: "5. ความสัมพันธ์ระหว่างโครงสร้างพอลิเมอร์กับสมบัติของพลาสติก ข้อใดถูกต้อง", options: ["ก. โครงสร้างแบบกิ่งมีความหนาแน่นสูงกว่าและจุดหลอมเหลวสูงกว่าโครงสร้างแบบเส้น", "ข. โครงสร้างแบบเส้นมีความหนาแน่นสูงกว่าและใสกว่าโครงสร้างแบบกิ่ง", "ค. โครงสร้างแบบร่างแหสามารถนำมาหลอมเพื่อขึ้นรูปใหม่ได้หลายครั้ง", "ง. โครงสร้างแบบเส้นจัดเรียงตัวชิดกันได้ดี ทำให้มีความแข็งแรงและจุดหลอมเหลวสูงกว่าแบบกิ่ง"], answer: 3, exp: "โครงสร้างแบบเส้นจัดเรียงตัวชิดกันได้ดีกว่าแบบกิ่ง จึงมีความหนาแน่น ความแข็งแรง และจุดหลอมเหลวสูงกว่า" },
    { q: "6. พลาสติกประเภทเทอร์มอพลาสติก (Thermoplastics) มีลักษณะสำคัญอย่างไร", options: ["ก. เมื่อได้รับความร้อนจะไหม้เกรียมเป็นเถ้าโดยไม่หลอมเหลว", "ข. มีโครงสร้างแบบร่างแหยึดเหนี่ยวกันแน่นหนา", "ค. เมื่อได้รับความร้อนจะอ่อนตัว และเมื่อเย็นลงจะแข็งตัว สามารถนำมารีไซเคิลได้", "ง. ทนต่อความร้อนและความดันสูงได้ดีกว่าเทอร์มอเซต"], answer: 2, exp: "เทอร์มอพลาสติกเมื่อได้รับความร้อนจะอ่อนตัวและหลอมเหลว นำกลับมารีไซเคิลได้หลายครั้ง" },
    { q: "7. ในการทดสอบพลาสติกเพื่อจำแนกประเภท ข้อใดเป็นผลการทดสอบของพลาสติกประเภทเทอร์มอเซต", options: ["ก. เมื่อลอยน้ำ จะจมน้ำ และเมื่อเผาไฟจะหลอมเหลวเป็นหยด", "ข. เมื่อได้รับความร้อนจะอ่อนตัว ยืดขยายได้ และมีกลิ่นฉุน", "ค. เมื่อได้รับความร้อนจะไม่หลอมเหลว แต่จะไหม้เกรียมหรือแตกอ้า", "ง. เมื่อใส่น้ำยาละลายเล็บ (อะซีโตน) จะละลายเป็นเนื้อเดียวทันที"], answer: 2, exp: "พลาสติกเทอร์มอเซตไม่หลอมเหลวเมื่อโดนความร้อน แต่จะไหม้เกรียมหรือแตกหลุดออก" },
    { q: "8. สัญลักษณ์การรีไซเคิลหมายเลข 1 (PETE หรือ PET) และหมายเลข 2 (HDPE) มักนำไปใช้ทำผลิตภัณฑ์ใดตามลำดับ", options: ["ก. ขวดน้ำดื่มบรรจุเย็น / ขวดนม ถุงพลาสติกหนา", "ข. ท่อน้ำประปา / จานชามเมลามีน", "ค. ถุงร้อนใส่อาหาร / ถ้วยโยเกิร์ต", "ง. กล่องโฟมบรรจุอาหาร / เสื้อกันฝน"], answer: 0, exp: "หมายเลข 1 PET ใช้ทำขวดน้ำดื่มบรรจุเย็น ส่วนหมายเลข 2 HDPE ใช้ทำขวดนม ถุงพลาสติกหนา/ถังน้ำ" },
    { q: "9. การเติม 'พลาสติไซเซอร์' (Plasticizer) ลงในพอลิเมอร์ เช่น PVC มีวัตถุประสงค์เพื่ออะไร", options: ["ก. เพิ่มจุดหลอมเหลวและทำให้พลาสติกแข็งแกร่งขึ้น", "ข. แทรกระหว่างสายพอลิเมอร์เพื่อลดแรงยึดเหนี่ยว ทำให้พลาสติกมีความยืดหยุ่นและนุ่มลง", "ค. ป้องกันการสลายตัวจากรังสี UV และทำให้พลาสติกไม่เปลี่ยนสี", "ง. เพิ่มการยึดเกาะของสายพอลิเมอร์ให้เกิดโครงสร้างแบบร่างแห"], answer: 1, exp: "พลาสติไซเซอร์ช่วยลดแรงยึดเหนี่ยวระหว่างสายพอลิเมอร์ ทำให้พลาสติกอ่อนตัว ยืดหยุ่น และนุ่มขึ้น" },
    { q: "10. กระบวนการวัลคาไนเซชัน (Vulcanization) ของยางธรรมชาติ ใช้สารใด และส่งผลต่อสมบัติยางอย่างไร", options: ["ก. ใช้คลอรีน; ทำให้ยางนุ่มลงและละลายในตัวทำละลายไดดีขึ้น", "ข. ใช้กำมะถัน; เกิดพันธะข้ามเชื่อมระหว่างสายพอลิเมอร์ ทำให้ยางมีความยืดหยุ่นสูงขึ้น ทนความร้อนและสารเคมีได้ดีขึ้น", "ค. ใช้น้ำตาล; ทำให้ยางย่อยสลายได้ง่ายตามธรรมชาติ", "ง. ใช้กรดซัลฟิวริก; ทำให้ยางแข็งตัวเป็นพลาสติกเทอร์มอเซตทันที"], answer: 1, exp: "กระบวนการวัลคาไนเซชันใช้กำมะถันสร้างพันธะข้ามเชื่อม เพิ่มความยืดหยุ่น ทนความร้อนและสารเคมี" },
    { q: "11. หากปริมาณของกำมะถันที่ใช้ในกระบวนการวัลคาไนเซชันเพิ่มขึ้นอย่างมาก จะเกิดผลอย่างไรต่อยาง", options: ["ก. ยางจะเหนียวและเหลวเหมือนกาว", "ข. ยางจะยืดหยุ่นได้ดีกว่าเดิมหลายเท่า", "ค. ยางจะแข็ง ทรหด เปราะ ไม่ยืดหยุ่น (เช่น ยางแข็งหรือ ebonite)", "ง. ยางจะคืนรูปไม่ได้เลยเมื่อถูกแรงกด"], answer: 2, exp: "หากใส่กำมะถันมากเกินไปจะเกิดพันธะข้ามเชื่อมหนาแน่น ยางจะกลายเป็นยางแข็ง เปราะ ไม่ยืดหยุ่น (Ebonite)" },
    { q: "12. การดัดแปรโครงสร้างพอลิเมอร์โดยการทำ 'กะพัดพอลิเมอร์' (Graft copolymerization) มีวัตถุประสงค์เพื่ออะไร", options: ["ก. กำจัดสารเจือปนในพอลิเมอร์", "ข. ปรับปรุงสมบัติของพอลิเมอร์เดิมให้มีคุณสมบัติใหม่ตามต้องการ เช่น เพิ่มการดูดซับน้ำ หรือความทนทาน", "ค. ลดมวลโมเลกุลของพอลิเมอร์ลงเพื่อให้ย่อยสลายเร็วขึ้น", "ง. เปลี่ยนพอลิเมอร์แบบสังเคราะห์ให้กลายเป็นพอลิเมอร์ธรรมชาติ"], answer: 1, exp: "Graft copolymerization เป็นการสังเคราะห์กิ่งก้านของพอลิเมอร์อีกชนิดลงบนสายหลัก เพื่อปรับปรุงสมบัติเดิมให้ได้คุณสมบัติใหม่" },
    { q: "13. การจัดการขยะพลาสติกวิธีใดที่เป็นมิตรต่อสิ่งแวดล้อมและสอดคล้องกับหลักการเศรษฐกิจหมุนเวียน (Circular Economy) มากที่สุด", options: ["ก. การเผาขยะพลาสติกในที่แจ้งเพื่อลดปริมาตรขยะ", "ข. การฝังกลบขยะพลาสติกทั้งหมดลงในดิน", "ค. การนำพลาสติกกลับมารีไซเคิลและการลดการใช้พลาสติกแบบใช้ครั้งเดียวทิ้ง (Single-use plastics)", "ง. การทิ้งขยะพลาสติกลงสู่ทะเลเพื่อให้จุลินทรีย์ในน้ำช่วยย่อยสลาย"], answer: 2, exp: "การลดการใช้ (Reduce) และการนำกลับมารีไซเคิล (Recycle) สอดคล้องกับหลัก Circular Economy" },
    { q: "14. สารมอนอเมอร์ CH2=CH-Cl เมื่อผ่านปฏิกิริยาพอลิเมอไรเซชันจะได้พอลิเมอร์ชื่อว่าอะไร และเป็นปฏิกิริยาประเภทใด", options: ["ก. พอลิเอทิลีน (PE), ปฏิกิริยาแบบเติม", "ข. พอลิไวนิลคลอไรด์ (PVC), ปฏิกิริยาแบบเติม", "ค. พอลิเอสเทอร์ (PET), ปฏิกิริยาแบบควบแน่น", "ง. พอลิโพรพีลีน (PP), ปฏิกิริยาแบบควบแน่น"], answer: 1, exp: "CH2=CH-Cl คือ Vinyl chloride เมื่อเกิดปฏิกิริยาแบบเติมจะได้ พอลิไวนิลคลอไรด์ (PVC)" },
    { q: "15. ข้อใดกล่าวถูกต้องเกี่ยวกับพอลิเมอร์ชีวภาพ (Biopolymers)", options: ["ก. เป็นพอลิเมอร์ที่สังเคราะห์มาจากปิโตรเลียมแต่สามารถย่อยสลายได้", "ข. เป็นพอลิเมอร์ที่พบในสิ่งมีชีวิต หรือสังเคราะห์จากวัตถุดิบธรรมชาติ เช่น PLA ซึ่งย่อยสลายได้ตามธรรมชาติ", "ค. เป็นพลาสติกที่ไม่สามารถย่อยสลายได้ แต่มีความคงทนสูงมาก", "ง. เกิดจากปฏิกิริยาพอลิเมอไรเซชันแบบเติมเท่านั้น"], answer: 1, exp: "พอลิเมอร์ชีวภาพพบในสิ่งมีชีวิต หรือสังเคราะห์จากวัตถุดิบธรรมชาติ (เช่น PLA) สามารถย่อยสลายได้ตามธรรมชาติ" },

    // หมวดที่ 2
    { section: "หมวดที่ 2: กระบวนการทางวิทยาศาสตร์ (ข้อ 16 - 19)", q: "16. ข้อใดเรียงลำดับขั้นตอนของวิธีการทางวิทยาศาสตร์ได้ถูกต้อง", options: ["ก. การตั้งสมมติฐาน → การสังเกตและระบุปัญหา → การทดลอง → การวิเคราะห์ข้อมูล → การสรุปผล", "ข. การสังเกตและระบุปัญหา → การตั้งสมมติฐาน → การออกแบบและการทดลอง → การวิเคราะห์ข้อมูล → การสรุปผล", "ค. การตั้งปัญหา → การสรุปผล → การตั้งสมมติฐาน → การทดลอง → การรวบรวมข้อมูล", "ง. การทดลอง → การสังเกต → การตั้งสมมติฐาน → การรวบรวมข้อมูล → การสรุปผล"], answer: 1, exp: "ลำดับที่ถูกต้อง: การสังเกตและระบุปัญหา → การตั้งสมมติฐาน → การทดลอง → การวิเคราะห์ข้อมูล → การสรุปผล" },
    { q: "17. นักเรียนคนหนึ่งต้องการศึกษาว่า 'ปริมาณกำมะถันมีผลต่อความยืดหยุ่นของยางสังเคราะห์หรือไม่' สิ่งใดคือ 'ตัวแปรต้น' และ 'ตัวแปรตาม' ตามลำดับ", options: ["ก. ความยืดหยุ่นของยาง / ปริมาณกำมะถัน", "ข. ปริมาณกำมะถัน / ความยืดหยุ่นของยาง", "ค. ชนิดของยางสังเคราะห์ / อุณหภูมิที่ใช้หลอม", "ง. เวลาที่ใช้ในการทดลอง / ปริมาณกำมะถัน"], answer: 1, exp: "ตัวแปรต้น (สาเหตุที่ศึกษา) คือ ปริมาณกำมะถัน; ตัวแปรตาม (ผลที่เกิด) คือ ความยืดหยุ่นของยาง" },
    { q: "18. ข้อความใดจัดเป็น 'สมมติฐาน' ที่ดีในการทดลองทางวิทยาศาสตร์", options: ["ก. พลาสติกชนิดใดทนทานที่สุด", "ข. หากเพิ่มปริมาณพลาสติไซเซอร์ใน PVC มากขึ้น ความอ่อนตัวของ PVC จะเพิ่มขึ้น", "ค. PVC มีประโยชน์ในการทำท่อน้ำประปา", "ง. การเผาพลาสติกทำให้เกิดก๊าซพิษที่เป็นอันตรายต่อร่างกาย"], answer: 1, exp: "สมมติฐานที่ดีต้องคาดคะเนผลอย่างมีเหตุผล พิสูจน์ได้ และระบุความสัมพันธ์ของตัวแปรต้น-ตัวแปรตามชัดเจน" },
    { q: "19. การกำหนด 'ตัวแปรควบคุม' ในการทดลองมีความสำคัญอย่างไร", options: ["ก. เพื่อให้การทดลองใช้เวลาน้อยที่สุด", "ข. เพื่อให้แน่ใจว่าผลการทดลองที่เกิดขึ้นมาจากตัวแปรต้นเท่านั้น ไม่ใช่จากปัจจัยอื่น", "ค. เพื่อให้สามารถเปลี่ยนผลการทดลองให้ตรงกับความต้องการได้", "ง. เพื่อเพิ่มจำนวนตัวแปรตามให้มากขึ้น"], answer: 1, exp: "ตัวแปรควบคุมต้องจัดให้เท่ากันทุกชุดการทดลอง เพื่อควบคุมไม่ให้ปัจจัยอื่นมาส่งผลต่อตัวแปรตาม" },

    // หมวดที่ 3
    { section: "หมวดที่ 3: การเขียนรายงานทางวิทยาศาสตร์ (ข้อ 20 - 23)", q: "20. ส่วนประกอบของรายงานทางวิทยาศาสตร์แบ่งออกเป็น 3 ส่วนหลัก ได้แก่ส่วนใดบ้าง", options: ["ก. บทนำ, เนื้อเรื่อง, บทสรุป", "ข. ส่วนนำ, ส่วนเนื้อหา, ส่วนท้าย", "ค. ปกหน้า, สารบัญ, บรรณานุกรม", "ง. บทที่ 1, บทที่ 2, บทที่ 3"], answer: 1, exp: "รายงานทางวิทยาศาสตร์แบ่งเป็น 3 ส่วนหลักคือ ส่วนนำ, ส่วนเนื้อหา และส่วนท้าย" },
    { q: "21. 'บทคัดย่อ' (Abstract) ของรายงานทางวิทยาศาสตร์ควรจัดอยู่ในส่วนใด และมีสาระสำคัญอย่างไร", options: ["ก. ส่วนเนื้อหา; บันทึกผลการทดลองแบบละเอียดทุกขั้นตอน", "ข. ส่วนนำ; สรุปภาพรวมของงานวิจัย ได้แก่ วัตถุประสงค์ วิธีการ ผลการทดลอง และข้อสรุปอย่างสั้น", "ค. ส่วนท้าย; ระบุรายชื่อหนังสือและเอกสารอ้างอิงทั้งหมด", "ง. ส่วนเนื้อหา; อธิบายทฤษฎีและเอกสารที่เกี่ยวข้องอย่างละเอียดยิบ"], answer: 1, exp: "บทคัดย่ออยู่ในส่วนนำ สรุปภาพรวมของวิจัยอย่างสั้นกระชับ ทั้งวัตถุประสงค์ วิธีการ ผล และข้อสรุป" },
    { q: "22. ในรายงานโครงงานวิทยาศาสตร์แบบ 5 บท 'วัสดุ อุปกรณ์ และวิธีดำเนินการทดลอง' จะอยู่ในบทใด", options: ["ก. บทที่ 1", "ข. บทที่ 2", "ค. บทที่ 3", "ง. บทที่ 4"], answer: 2, exp: "บทที่ 3 ของรายงาน 5 บท คือ วัสดุอุปกรณ์และวิธีดำเนินการทดลอง" },
    { q: "23. ข้อใดจัดเป็นองค์ประกอบใน 'ส่วนท้าย' ของรายงานทางวิทยาศาสตร์", options: ["ก. บทคัดย่อ และ กิตติกรรมประกาศ", "ข. วัตถุประสงค์ และ ขอบเขตการศึกษา", "ค. บรรณานุกรม (เอกสารอ้างอิง) และ ภาคผนวก", "ง. ผลการทดลอง และ อภิปรายผล"], answer: 2, exp: "ส่วนท้ายประกอบด้วย บรรณานุกรม (เอกสารอ้างอิง) และ ภาคผนวก" },

    // หมวดที่ 4
    { section: "หมวดที่ 4: การนำเสนอผลงานทางวิทยาศาสตร์ (ข้อ 24 - 26)", q: "24. ข้อใดเป็นหลักการออกแบบโปสเตอร์นำเสนอผลงานทางวิทยาศาสตร์ที่ดี", options: ["ก. ใส่ข้อความเนื้อหาอัดแน่นทุกพื้นที่เพื่อความสมบูรณ์ของข้อมูล", "ข. ใช้แบบอักษรหลากสีสันหลายรูปแบบในแผ่นเดียวกันเพื่อความสวยงาม", "ค. จัดลำดับเนื้อหาให้เน้นภาพ แผนภูมิ และจุดเด่นของงาน โดยมีขนาดตัวอักษรที่อ่านได้ชัดเจนจากระยะ 1-2 เมตร", "ง. ใช้ตารางข้อมูลขนาดใหญ่ที่เต็มไปด้วยตัวเลขโดยไม่ต้องมีสรุปกราฟ"], answer: 2, exp: "โปสเตอร์ที่ดีเน้นความกระชับ อ่านง่าย ใช้รูปภาพ/แผนภูมิสื่อความหมาย ตัวอักษรชัดเจนในระยะ 1-2 เมตร" },
    { q: "25. การเลือกใช้ 'แผนภูมิแท่ง' (Bar chart) เหมาะสมที่สุดสำหรับการนำเสนอข้อมูลประเภทใด", options: ["ก. การเปรียบเทียบข้อมูลเชิงปริมาณของกลุ่มตัวอย่างต่าง ๆ", "ข. การแสดงสัดส่วนร้อยละของข้อมูลทั้งหมด", "ค. การแสดงแนวโน้มและการเปลี่ยนแปลงของข้อมูลตามเวลา", "ง. การแสดงโครงสร้างภายในของสารเคมี"], answer: 0, exp: "แผนภูมิแท่งเหมาะสำหรับเปรียบเทียบข้อมูลเชิงปริมาณของกลุ่มตัวอย่างต่าง ๆ" },
    { q: "26. ข้อใดถือเป็นมารยาทที่ไม่เหมาะสมในการเป็นผู้ฟังการประชุมวิชาการทางวิทยาศาสตร์", options: ["ก. ปิดเสียงโทรศัพท์มือถือขณะผู้นำเสนอกำลังบรรยาย", "ข. ยกมือถามคำถามแทรกขัดจังหวะทันทีขณะผู้นำเสนอกำลังพูดในสไลด์แรก", "ค. จดบันทึกประเด็นสำคัญและข้อสงสัยไว้ถามช่วงเปิดโอกาสให้ซักถาม", "ง. ให้เกียรติและปรบมือให้ผู้นำเสนอเมื่อการบรรยายเสร็จสิ้น"], answer: 1, exp: "ไม่ควรถามแทรกขัดจังหวะทันที ควรอุดหนุนบรรยากาศโดยรอถามช่วงซักถามท้ายการบรรยาย" },

    // หมวดที่ 5
    { section: "หมวดที่ 5: กระบวนการออกแบบเชิงวิศวกรรม (ข้อ 27 - 30)", q: "27. ขั้นตอนแรกสุดของกระบวนการออกแบบเชิงวิศวกรรม (Engineering Design Process) คืออะไร", options: ["ก. การออกแบบวิธีการแก้ปัญหา", "ข. การระบุปัญหา (Problem Identification)", "ค. การทดสอบและประเมินผล", "ง. การวางแผนและดำเนินการ"], answer: 1, exp: "ขั้นตอนแรกคือ 'การระบุปัญหา' เพื่อทำความเข้าใจเงื่อนไขและข้อกำหนดให้ชัดเจน" },
    { q: "28. ข้อใดคือความแตกต่างสำคัญระหว่าง 'กระบวนการทางวิทยาศาสตร์' และ 'กระบวนการออกแบบเชิงวิศวกรรม'", options: ["ก. กระบวนการทางวิทยาศาสตร์เน้นการแสวงหาความรู้ใหม่ ส่วนการออกแบบเชิงวิศวกรรมเน้นการแก้ปัญหาหรือสร้างสิ่งใหม่", "ข. กระบวนการทางวิทยาศาสตร์ไม่มีการทดลอง ส่วนกระบวนการออกแบบเชิงวิศวกรรมเน้นการทดลองเท่านั้น", "ค. กระบวนการทางวิทยาศาสตร์ใช้กับเคมีเท่านั้น ส่วนกระบวนการออกแบบเชิงวิศวกรรมใช้กับฟิสิกส์เท่านั้น", "ง. ทั้งสองกระบวนการไม่มีความแตกต่างกัน สามารถใช้แทนกันได้ทุกกรณี"], answer: 0, exp: "วิทยาศาสตร์เน้นค้นหาความรู้ใหม่/อธิบายปรากฏการณ์ธรรมชาติ แต่วิศวกรรมเน้นประยุกต์ความรู้สร้างสิ่งใหม่แก้ปัญหา" },
    { q: "29. ในขั้นตอน 'การทดสอบ ประเมินผล และปรับปรุงแก้ไข' ของกระบวนการออกแบบเชิงวิศวกรรม หากชิ้นงานทดสอบแล้วพบว่ายังทำงานได้ไม่ตรงตามข้อกำหนด ควรทำอย่างไร", options: ["ก. ยกเลิกโครงการทันทีและเริ่มต้นคิดปัญหาใหม่", "ข. นำเสนอชิ้นงานไปตามสภาพโดยปิดบังข้อบกพร่องไว้", "ค. ย้อนกลับไปวิเคราะห์สาเหตุของปัญหา ปรับปรุงการออกแบบ และทดสอบซ้ำ", "ง. สรุปผลว่าชิ้นงานสำเร็จแล้ว"], answer: 2, exp: "กระบวนการวิศวกรรมเป็นวงซ้ำ หากพบข้อบกพร่องต้องวิเคราะห์ ปรับปรุงแก้ไข แล้วทดสอบซ้ำ" },
